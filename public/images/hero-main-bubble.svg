<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Bubble 1 (Main Big Bubble) -->
    <radialGradient id="b1_body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#93C5FD" stop-opacity="0.18" />
      <stop offset="95%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.6" />
    </radialGradient>
    <linearGradient id="b1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#BFDBFE" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#DBEAFE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Bubble 2 (Top Right) -->
    <radialGradient id="b2_body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#93C5FD" stop-opacity="0.12" />
      <stop offset="92%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.7" />
    </radialGradient>

    <!-- Bubble 3 (Top Left Small) -->
    <radialGradient id="b3_body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#93C5FD" stop-opacity="0.2" />
      <stop offset="95%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Big Center-Left Bubble -->
  <g transform="translate(310, 360)">
    <!-- Bubble Body -->
    <circle r="190" fill="url(#b1_body)" stroke="url(#b1_rim)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Top-Left Main Highlight Curve -->
    <path d="M -125 -105 C -90 -150 -30 -170 45 -165 C 30 -145 -20 -130 -85 -90 Z" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Top-Left Secondary Glint Spot -->
    <ellipse cx="-135" cy="-80" rx="6" ry="14" transform="rotate(-35 -135 -80)" fill="#FFFFFF" opacity="0.85" />
    
    <!-- Bottom-Right Internal Crescent Reflection -->
    <path d="M 65 140 C 115 110 145 60 155 -5 C 145 40 120 90 75 125 Z" fill="#FFFFFF" opacity="0.7" />
    
    <!-- Inner ambient soft glow -->
    <ellipse cx="-30" cy="-50" rx="110" ry="70" fill="#FFFFFF" opacity="0.08" />
  </g>

  <!-- Top Right Medium Bubble -->
  <g transform="translate(670, 110)">
    <circle r="85" fill="url(#b2_body)" stroke="url(#b1_rim)" stroke-width="3" filter="url(#glow)" />
    <!-- Highlight -->
    <path d="M -55 -45 C -40 -65 -15 -75 20 -72 C 12 -63 -10 -55 -38 -38 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Glint -->
    <ellipse cx="-60" cy="-35" rx="3" ry="7" transform="rotate(-35 -60 -35)" fill="#FFFFFF" opacity="0.8" />
    <!-- Bottom Right Crescent -->
    <path d="M 30 60 C 50 48 65 25 70 -5 C 65 18 52 40 34 52 Z" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- Top Left Small Bubble -->
  <g transform="translate(55, 100)">
    <circle r="36" fill="url(#b3_body)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
    <path d="M -22 -18 C -15 -28 -5 -32 10 -30 C 5 -26 -4 -22 -15 -14 Z" fill="#FFFFFF" opacity="0.9" />
    <ellipse cx="-25" cy="-12" rx="1.5" ry="4" transform="rotate(-35 -25 -12)" fill="#FFFFFF" opacity="0.8" />
    <path d="M 12 25 C 22 20 28 10 30 -2 C 28 8 22 17 14 22 Z" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>